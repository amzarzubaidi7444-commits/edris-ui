<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1469E2" />
  <meta name="description" content="EDRIS Health Education - dialysis and kidney health education." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EDRIS" />
  <title>EDRIS Health Education</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="app-header" id="appHeader">
      <button class="brand-button" id="brandButton" aria-label="EDRIS home">
        <img src="assets/icons/icon-192.png" alt="" class="brand-mark" />
        <span class="brand-copy">
          <strong>EDRIS</strong>
          <small>Health Education</small>
        </span>
      </button>

      <div class="header-actions">
        <button class="icon-button" id="searchButton" aria-label="Search">
          <span data-icon="search"></span>
        </button>
        <button class="profile-button" id="profileButton" aria-label="Open settings">
          <span>A</span>
        </button>
      </div>
    </header>

    <aside class="desktop-rail" aria-label="Primary navigation">
      <div class="rail-brand">
        <img src="assets/icons/icon-192.png" alt="" />
        <div><strong>EDRIS</strong><small>Health Education</small></div>
      </div>
      <nav class="rail-nav" id="railNav"></nav>
      <div class="rail-note">
        <span data-icon="shield"></span>
        <p>Clinically structured health education for dialysis patients.</p>
      </div>
    </aside>

    <main id="app" class="app-main" tabindex="-1">
      <div class="initial-loader" aria-live="polite">
        <div class="loader-mark"></div>
        <span>Loading EDRIS…</span>
      </div>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation"></nav>
  </div>

  <dialog class="search-dialog" id="searchDialog">
    <div class="search-sheet">
      <div class="search-sheet-head">
        <button class="icon-button back" id="closeSearch" aria-label="Close search">
          <span data-icon="arrow-left"></span>
        </button>
        <label class="search-field">
          <span data-icon="search"></span>
          <input id="globalSearchInput" type="search" autocomplete="off" placeholder="Cari topik kesihatan..." />
          <button type="button" id="clearSearch" class="clear-search" aria-label="Clear search">×</button>
        </label>
      </div>
      <div class="search-results-wrap">
        <p class="search-helper">Search in Bahasa Melayu or English.</p>
        <div id="searchResults"></div>
      </div>
    </div>
  </dialog>


  <dialog class="action-dialog" id="actionDialog">
    <div class="action-sheet" role="document">
      <div class="action-sheet-handle" aria-hidden="true"></div>
      <div class="action-sheet-head">
        <div>
          <small id="actionDialogKicker">EDRIS</small>
          <h2 id="actionDialogTitle">Action</h2>
        </div>
        <button class="icon-button" id="closeActionDialog" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div id="actionDialogBody" class="action-dialog-body"></div>
      <div id="actionDialogActions" class="action-dialog-actions"></div>
    </div>
  </dialog>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <span aria-hidden="true">↑</span>
  </button>

  <div class="network-indicator" id="networkIndicator" role="status" aria-live="polite"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
