<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>EDRIS — Education</title>

  <link rel="stylesheet" href="assets/css/education-reference.css" />
</head>
<body>
  <main class="education-app" id="educationApp">
    <section class="screen-stage" id="screenStage" aria-live="polite">
      <img
        id="screenImage"
        class="reference-screen"
        src="assets/education/page-01.webp"
        alt="EDRIS Education"
        draggable="false"
      />

      <!-- Invisible interaction layer. It does not alter the PDF reference visuals. -->
      <div id="hotspots" class="hotspots" aria-label="Interactive areas"></div>

      <button class="edge-zone edge-left" id="previousPage" aria-label="Previous education screen"></button>
      <button class="edge-zone edge-right" id="nextPage" aria-label="Next education screen"></button>
    </section>
  </main>

  <div class="reference-toast" id="referenceToast" role="status" aria-live="polite"></div>

  <script src="assets/js/education-reference.js"></script>
</body>
</html>
